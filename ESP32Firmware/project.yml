name: ESP32Firmware
options:
  bundleIdPrefix: cn.folotoy
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  Defaults:
    url: https://github.com/sindresorhus/Defaults.git
    from: "8.0.0"

targets:
  ESP32Firmware:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # 资源必须挂在 sources 下并显式指定 buildPhase: resources，
      # 否则 XcodeGen 不会生成 PBXResourcesBuildPhase，
      # Assets.xcassets 就不会被编译进 App（表现为应用没有图标）。
      - path: Resources
        buildPhase: resources
        excludes:
          - "esptool_deps"
          - "Info.plist"
          - "ESP32Firmware.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.folotoy.ESP32Firmware
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_NAME: ESP32固件管理
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Resources/ESP32Firmware.entitlements
    dependencies:
      - package: Defaults
      - sdk: WebKit.framework
    entitlements:
      path: Resources/ESP32Firmware.entitlements
      properties:
        com.apple.security.app-sandbox: false
    postBuildScripts:
      - name: "Copy esptool_deps to Resources"
        script: |
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/esptool_deps"
          mkdir -p "$DEST"
          # 排除 __pycache__ 与 .pyc：vendored 依赖源码树里带有编译缓存，
          # 体积大且无用（不同 Python 版本之间也不通用）。
          rsync -a --exclude '__pycache__' --exclude '*.pyc' \
            "${SRCROOT}/Resources/esptool_deps/" "$DEST/"
